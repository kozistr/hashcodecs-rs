name: CI
run-name: CI / ${{ github.ref_name }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust_quality:
    name: Rust / Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust library
        run: cargo clippy -- -D warnings

      - name: Lint all Rust targets
        run: cargo clippy --all-targets --features python -- -D warnings

      - name: Install Rust coverage tool
        uses: taiki-e/install-action@v2.85.10
        with:
          tool: cargo-llvm-cov

      - name: Check Rust line coverage
        run: cargo llvm-cov --no-default-features --fail-under-lines 100

  rust_test:
    name: Rust / Test / ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1

      - name: Test Rust Python feature
        run: cargo test --features python

  rust_release_test:
    name: Rust / Release Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1

      - name: Test optimized Rust library
        run: cargo test --release --features python

  rust_arm_test:
    name: Rust / Test / ubuntu-24.04-arm
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1

      - name: Test Rust Python feature
        run: cargo test --features python

  rust_asan:
    name: Rust / AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up nightly Rust with source
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Test Base64 with AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu base64::tests::

  python_quality:
    name: Python / Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          cache-dependency-glob: uv.lock

      - name: Install Python development dependencies
        run: uv sync --no-install-project --frozen

      - name: Lint Python
        run: uv run --frozen --no-sync ruff check .

      - name: Check Python formatting
        run: uv run --frozen --no-sync ruff format --check .

  python_wheel:
    name: Python / Build / ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          cache-dependency-glob: uv.lock

      - name: Build Python wheel
        run: uv build --wheel --out-dir dist

      - name: Upload Python wheel
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-wheel-${{ matrix.os }}
          path: dist/*.whl
          retention-days: 1

  python_test:
    name: Python / Test / ${{ matrix.os }} / ${{ matrix.python-version }}
    needs: python_wheel
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      - name: Install Python development dependencies
        run: uv sync --no-install-project --frozen

      - name: Download Python wheel
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-wheel-${{ matrix.os }}
          path: dist

      - name: Install Python wheel
        run: uv pip install --python .venv --reinstall --no-index --find-links dist hashcodecs

      - name: Test Python API and coverage
        run: uv run --frozen --no-sync pytest tests --cov=hashcodecs --cov-branch --cov-fail-under=100
