name: CI
run-name: CI / ${{ github.ref_name }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      skip_coverage_upload:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust_quality:
    name: Rust / Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust library
        run: cargo clippy -- -D warnings

      - name: Lint all Rust targets
        run: cargo clippy --all-targets --features python -- -D warnings

      - name: Install Rust coverage tool
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-llvm-cov

      - name: Check Rust core line coverage
        run: |
          cargo llvm-cov --no-default-features --fail-under-lines 100 \
            --ignore-filename-regex 'avx512\.rs$' --show-missing-lines
          cargo llvm-cov report --ignore-filename-regex 'avx512\.rs$' \
            --cobertura --output-path coverage.xml

      - name: Upload Rust coverage to Codecov
        if: ${{ !inputs.skip_coverage_upload }}
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: rust
          fail_ci_if_error: true

  rust_test:
    name: Rust / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Test Rust Python feature
        run: cargo test --features python

  rust_quality_arm:
    name: Rust / Quality / macOS ARM64
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Lint all Rust targets
        run: cargo clippy --all-targets --features python -- -D warnings

  rust_release_test:
    name: Rust / Release Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Test optimized Rust library
        run: cargo test --release --features python

  rust_arm_test:
    name: Rust / Test / ubuntu-24.04-arm
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Test Rust Python feature
        run: cargo test --features python

  rust_sanitizers:
    name: Rust / Safety / ${{ matrix.name }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: AddressSanitizer
            flags: -Zsanitizer=address
          - name: MemorySanitizer
            flags: -Zsanitizer=memory -Zsanitizer-memory-track-origins
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up nightly Rust with source
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly
          components: rust-src

      - name: Check runtime SIMD paths
        env:
          RUSTFLAGS: ${{ matrix.flags }}
          RUSTDOCFLAGS: ${{ matrix.flags }}
        run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --test sanitizers

  rust_safety_kani:
    name: Rust / Safety / Kani
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Prove raw-load and buffer bounds
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1

  rust_safety_miri:
    name: Rust / Safety / Miri
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up nightly Rust with Miri
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly
          components: miri

      - name: Interpret codec and hash boundary paths
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo miri test --lib miri_tests

  rust_safety_fuzz:
    name: Rust / Safety / Fuzz / ${{ matrix.target }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target: [base64, murmur3, xxhash]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Differential fuzz ${{ matrix.target }}
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=30 -rss_limit_mb=2048

  python_quality:
    name: Python / Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
          cache-dependency-glob: uv.lock

      - name: Install Python development dependencies
        run: uv sync --no-install-project --frozen

      - name: Lint Python
        run: uv run --frozen --no-sync ruff check .

      - name: Check Python formatting
        run: uv run --frozen --no-sync ruff format --check .

  python_test:
    name: Python / Test / ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux / Python 3.12
            os: ubuntu-latest
            python-version: "3.12"
            upload-coverage: true
          - name: Linux / Python 3.15t
            os: ubuntu-latest
            python-version: "3.15t"
            upload-coverage: true
          - name: Windows / Python 3.12
            os: windows-latest
            python-version: "3.12"
            upload-coverage: true
          - name: macOS ARM64 / Python 3.12
            os: macos-latest
            python-version: "3.12"
            upload-coverage: true
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          save-if: ${{ matrix.python-version == '3.12' }}

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      - name: Install test dependencies
        run: uv sync --no-install-project --frozen

      - name: Build Python wheel
        run: uv build --wheel --out-dir dist

      - name: Install Python wheel
        run: uv pip install --python .venv --reinstall --no-index --find-links dist hashcodecs

      - name: Test Python API and coverage
        run: uv run --frozen --no-sync pytest tests --cov=hashcodecs --cov-branch --cov-fail-under=100 --cov-report=xml:coverage.xml

      - name: Upload Python coverage to Codecov
        if: ${{ matrix.upload-coverage && !inputs.skip_coverage_upload }}
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          name: python-${{ matrix.os }}-py${{ matrix.python-version }}
          env_vars: RUNNER_OS,PYTHON_VERSION
          fail_ci_if_error: true
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
