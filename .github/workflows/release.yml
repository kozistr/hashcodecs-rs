name: Release
run-name: Release / ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  wheels:
    name: Wheel / ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          output-dir: dist

      - name: Upload wheels
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  source:
    name: Source Distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build source distribution
        run: uv build --sdist --out-dir dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: source
          path: dist

  publish:
    name: Publish / PyPI
    needs: [wheels, source]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Publish distributions
        run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.HASHCODECS_PYPI_TOKEN }}

  github_release:
    name: Publish / GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release, changelog, and assets
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag --title "hashcodecs $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
