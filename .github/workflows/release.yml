name: Test and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v9.0.0
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo clippy --all-targets --features python -- -D warnings
      - run: cargo test
      - run: cargo test --features python
      - uses: taiki-e/install-action@v2.85.10
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --no-default-features --fail-under-lines 100
      - run: uv sync --all-groups --no-install-project --frozen
      - run: uv run --frozen --no-sync ruff check .
      - run: uv run --frozen --no-sync ruff format --check .
      - run: uv build --wheel --out-dir dist
      - run: uv pip install --python .venv --reinstall --no-index --find-links dist hashcodecs
      - run: uv run --frozen --no-sync pytest --cov=hashcodecs --cov-branch --cov-fail-under=100

  wheels:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: pypa/cibuildwheel@v4.1.0
        with:
          output-dir: dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  source:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv build --sdist --out-dir dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: source
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, wheels, source]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.HASHCODECS_PYPI_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
