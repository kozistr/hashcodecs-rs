[package]
name = "hashcodecs"
version = "1.5.0"
edition = "2024"
rust-version = "1.94"
autobenches = false
description = "SIMD-accelerated Base64 codecs and fast MurmurHash3 and xxHash implementations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kozistr/hashcodecs-rs"
keywords = ["base64", "simd", "murmur3", "xxhash", "python"]
categories = ["encoding", "algorithms"]
readme = "README.md"
include = [
    "/generated/**",
    "/src/**",
    "/benches/**",
    "/tests/sanitizers.rs",
    "/build.rs",
    "/rustfmt.toml",
    "/README.md",
    "/LICENSE",
    "/LICENSE-MIT",
]

[workspace]
members = [".", "benches"]
default-members = ["."]
resolver = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
clone_on_ref_ptr = "warn"
implicit_clone = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
wildcard_imports = "warn"

[lints]
workspace = true

[lib]
name = "hashcodecs"
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:memchr", "dep:pyo3", "dep:pyo3-build-config"]
extension-module = ["python", "dep:mimalloc", "pyo3/extension-module"]

[dependencies]
memchr = { version = "2.8.0", optional = true }
mimalloc = { version = "0.1.52", optional = true }
pyo3 = { version = "0.29.2", optional = true }

[build-dependencies]
pyo3-build-config = { version = "0.29.2", optional = true }

[dev-dependencies]
base64 = "=0.23.1"
murmur3 = "=0.5.2"
xxhash-c-sys = "=0.8.7"
xxhash-rust = { version = "=0.8.18", features = ["xxh3"] }

[[test]]
name = "sanitizers"
path = "tests/sanitizers.rs"
harness = false

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

[profile.bench]
codegen-units = 1
lto = "fat"
opt-level = 3
