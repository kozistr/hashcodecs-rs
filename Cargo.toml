[package]
name = "hashcodecs"
version = "1.2.1"
edition = "2024"
rust-version = "1.89"
description = "SIMD-accelerated Base64 codecs and fast MurmurHash3 and xxHash implementations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kozistr/hashcodecs-rs"
keywords = ["base64", "simd", "murmur3", "xxhash", "python"]
categories = ["encoding", "algorithms"]
readme = "README.md"
include = [
    "/src/**",
    "/benches/**",
    "/tests/sanitizers.rs",
    "/build.rs",
    "/README.md",
    "/LICENSE",
    "/LICENSE-MIT",
]

[lib]
name = "hashcodecs"
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:memchr", "dep:pyo3", "dep:pyo3-build-config"]
extension-module = ["python", "dep:mimalloc", "pyo3/extension-module"]

[dependencies]
memchr = { version = "2.8.0", optional = true }
mimalloc = { version = "0.1.52", optional = true }
pyo3 = { version = "0.29.2", optional = true }

[build-dependencies]
pyo3-build-config = { version = "0.29.2", optional = true }

[dev-dependencies]
base64 = "=0.23.1"
base64-turbo = "=0.3.0"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
fastmurmur3 = "=0.2.0"
mimalloc = "=0.1.52"
mm3h = "=0.1.3"
murmur3 = "=0.5.2"
murmurs = "=1.0.5"
xxhash-c-sys = "=0.8.7"
xxhash-rust = { version = "=0.8.18", features = ["xxh3"] }

[[bench]]
name = "base64"
harness = false

[[bench]]
name = "murmur3"
harness = false

[[bench]]
name = "xxhash"
harness = false

[[bench]]
name = "crossover"
harness = false

[[test]]
name = "sanitizers"
path = "tests/sanitizers.rs"
harness = false

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

[profile.bench]
codegen-units = 1
lto = "fat"
opt-level = 3
