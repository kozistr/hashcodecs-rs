[package]
name = "hashcodecs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "SIMD-accelerated Base64 codecs and fast MurmurHash3 implementations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kozistr/hashcodecs-rs"
keywords = ["base64", "simd", "murmur3", "python"]
categories = ["encoding", "algorithms"]
readme = "README.md"

[lib]
name = "hashcodecs"
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
mimalloc = "0.1.52"
pyo3 = { version = "0.29.2", features = ["abi3-py310"], optional = true }

[dev-dependencies]
base64 = "0.23.1"
base64-turbo = "0.2.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
fastmurmur3 = "0.2.0"
mm3h = "0.1.3"
murmur3 = "0.5"
murmurs = "1.0.5"

[[bench]]
name = "base64"
harness = false

[[bench]]
name = "murmur3"
harness = false

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

[profile.bench]
codegen-units = 1
lto = "fat"
opt-level = 3
