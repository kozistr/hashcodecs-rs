<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">CPython 3.12 standard Base64 throughput</title>
<desc id="desc">On CPython 3.12 with 4 KiB inputs, hashcodecs reaches 23.57 GiB/s encoding and 17.94 GiB/s decoding. Both panels use the same throughput scale. Higher is better.</desc>
