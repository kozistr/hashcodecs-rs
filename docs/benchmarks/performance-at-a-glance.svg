<text x="600" y="84" text-anchor="middle" fill="#465263" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">Standard • CPython 3.14.6 free-threaded • 4 KiB inputs • GiB/s, higher is better</text>
