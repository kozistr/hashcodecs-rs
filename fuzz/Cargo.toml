[package]
name = "hashcodecs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
base64 = "0.23.1"
hashcodecs = { path = ".." }
libfuzzer-sys = "0.4"
murmur3 = "0.5"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[[bin]]
name = "base64"
path = "fuzz_targets/base64.rs"
test = false
doc = false
bench = false

[[bin]]
name = "murmur3"
path = "fuzz_targets/murmur3.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xxhash"
path = "fuzz_targets/xxhash.rs"
test = false
doc = false
bench = false

[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
clone_on_ref_ptr = "warn"
implicit_clone = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
wildcard_imports = "warn"
