site_name: hashcodecs
site_description: SIMD-accelerated Base64, MurmurHash3, and XXH3 for Python and Rust
repo_name: 'kozistr/hashcodecs-rs'
repo_url: 'https://github.com/kozistr/hashcodecs-rs'
edit_uri: edit/main/docs/

theme:
  name: material
  features:
  - content.action.edit
  - content.action.view
  - content.code.copy
  - navigation.footer
  - navigation.path
  - navigation.tabs.sticky
  - navigation.top
  - search.highlight
  - search.suggest
  - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            allow_inspection: false
            show_root_full_path: false
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Base64: base64.md
  - MurmurHash3: murmur3.md
  - XXH3: xxh3.md
  - API Reference:
    - Base64: api/base64.md
    - MurmurHash3: api/murmur3.md
    - XXH3: api/xxh3.md
  - Performance: performance.md
  - Benchmark Details: https://github.com/kozistr/hashcodecs-rs/blob/main/BENCHMARK.md
  - Architecture: ARCHITECTURE.md
