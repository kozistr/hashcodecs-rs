[build-system]
requires = ["hatchling>=1.27,<2", "packaging>=26,<27"]
build-backend = "hatchling.build"

[project]
name = "hashcodecs"
version = "0.6.0"
description = "SIMD-accelerated Base64, MurmurHash3, and xxHash codecs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.16,<0.17",
]
benchmark = [
    "mmh3>=5.2.1,<6",
    "pybase64>=1.4.3,<2",
    "xxhash>=3.6,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["python/hashcodecs"]

[tool.hatch.build.targets.sdist]
include = [
    "/BENCHMARK.md",
    "/Cargo.lock",
    "/Cargo.toml",
    "/build.rs",
    "/hatch_build.py",
    "/LICENSE*",
    "/README.md",
    "/benches",
    "/python",
    "/src",
]
exclude = ["/src/base64/tests.rs"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
build-frontend = "uv"
skip = "*-musllinux*"
test-command = "python -c \"import hashcodecs; assert hashcodecs.b64decode(hashcodecs.b64encode(b'hashcodecs')) == b'hashcodecs'\""

[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "PERF",
    "PIE",
    "PTH",
    "PT",
    "PYI",
    "Q",
    "RET",
    "RUF",
    "SIM",
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.isort]
combine-as-imports = false
detect-same-package = true
force-sort-within-sections = false

[tool.ruff.format]
quote-style = "single"

[tool.coverage.run]
branch = true
source = ["hashcodecs"]

[tool.coverage.report]
fail_under = 100
show_missing = true
