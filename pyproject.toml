[build-system]
requires = ["hatchling>=1.27,<2", "packaging>=26,<27"]
build-backend = "hatchling.build"

[project]
name = "hashcodecs"
version = "0.6.1"
description = "SIMD-accelerated Base64, MurmurHash3, and xxHash codecs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "kozistr" }]
keywords = ["base64", "simd", "murmur3", "xxhash", "rust"]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://hashcodecs-rs.readthedocs.io/"
Repository = "https://github.com/kozistr/hashcodecs-rs"
Issues = "https://github.com/kozistr/hashcodecs-rs/issues"
Changelog = "https://github.com/kozistr/hashcodecs-rs/blob/main/CHANGELOG.md"

[dependency-groups]
wheel-test = ["pytest==9.1.1"]
dev = [
    { include-group = "wheel-test" },
    "pytest-cov>=7,<8",
    "ruff>=0.16,<0.17",
]
benchmark = [
    "mmh3>=5.2.1,<6",
    "pybase64>=1.4.3,<2",
    "xxhash>=3.6,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["hashcodecs"]

[tool.hatch.build.targets.sdist]
include = [
    "/CITATION.cff",
    "/CHANGELOG.md",
    "/BENCHMARK.md",
    "/Cargo.lock",
    "/Cargo.toml",
    "/build.rs",
    "/hatch_build.py",
    "/LICENSE*",
    "/README.md",
    "/SAFETY.md",
    "/SECURITY.md",
    "/benches",
    "/docs",
    "/hashcodecs",
    "/src",
]
exclude = ["/src/base64/tests.rs"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-* cp314t-* cp315t-*"
build-frontend = "uv"
skip = "*-musllinux*"
test-groups = ["wheel-test"]
test-sources = ["tests"]
test-command = "python -m pytest tests"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "PERF",
    "PIE",
    "PTH",
    "PT",
    "PYI",
    "Q",
    "RET",
    "RUF",
    "SIM",
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.isort]
combine-as-imports = false
detect-same-package = true
force-sort-within-sections = false

[tool.ruff.format]
quote-style = "single"

[tool.coverage.run]
branch = true
source_pkgs = ["hashcodecs"]

[tool.coverage.paths]
source = [
    "hashcodecs",
    "*/site-packages/hashcodecs",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
